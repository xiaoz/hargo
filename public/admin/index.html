 <!-- 使用稳定的 jsdelivr CDN -->
 <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.3.0/dist/decap-cms.min.js"></script>

 <script>
   (function () {
     // 从 URL hash 读取 token
     const hash = window.location.hash;
     if (hash.startsWith('#access_token=')) {
       const token = hash.replace('#access_token=', '');
       if (token) {
         // 构造 Decap 要求的格式
         const authData = {
           token: token,
           // 设置一个未来的过期时间
           expires_at: Date.now() + 3600 * 1000
         };
         // 存入 Decap 识别的 key
         localStorage.setItem('decap-cms-auth', JSON.stringify(authData));
         // 清掉 URL 中的 token，刷新页面让 Decap 自动读取
         window.location.href = window.location.pathname;
       }
     }
   })();
 </script>
