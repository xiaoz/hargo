<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }} - {{ .Site.Title }}</title>
  {{ partial "head.html" . }}
  <!-- Pagefind CSS -->
  <!-- <link rel="stylesheet" href="https://unpkg.com/pagefind@1.0.3/pagefind-ui.css"> -->
  <!-- 引用 Pagefind 本地生成的资源（构建后自动存在，无需手动上传） -->
<link rel="stylesheet" href="/pagefind/pagefind-ui.css">
</head>
<body>
  {{ partial "header.html" . }}

  <main class="container py-5">
    <h1 class="mb-4">Search Products</h1>
    <div id="search"></div>
  </main>

  {{ partial "footer.html" . }}

  <!-- Pagefind JS -->
  <!-- <script src="https://unpkg.com/pagefind@1.0.3/pagefind-ui.js"></script> -->
<script src="/pagefind/pagefind-ui.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      new PagefindUI({
        element: "#search",
        showSubResults: true,
        placeholder: "Search products...", // 英文搜索占位符
        showImages: true, // 👈 开启图片显示
        excerptLength: 30, // 简介长度
        filters: { section: "products" }, // 👈 强制只显示商品

        highlightParam: "highlight",
        sort: ["title"],
        lang: "en",
        // 完整英文UI文案（覆盖默认翻译）
        translations: {
          placeholder: "Search products...",
          clear: "Clear",
          load_more: "Load more results",
          zero_results: "No products found for [SEARCH_TERM]",
          searching: "Searching...",
          results_count: "[COUNT] results"
        },
          // 👇 修正图片URL（防止相对路径）
        processResult: function (result) {
        if (result.meta.image && !result.meta.image.startsWith('http')) {
            result.meta.image = window.location.origin + result.meta.image;
        }
        return result;
        }
      });

        // 重点：读取 URL ?q=xxx 并自动填入 + 搜索
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (q && q.trim() !== '') {
            // 等待 Pagefind UI 挂载后再填值
            const interval = setInterval(() => {
            const input = document.querySelector('#search input');
            if (input) {
                input.value = q;
                input.dispatchEvent(new Event('input', { bubbles: true }));
                clearInterval(interval);
            }
            }, 50);
        }


    });
    </script>
</body>
</html>
