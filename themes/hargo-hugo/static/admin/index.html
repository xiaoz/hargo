<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Admin</title>
  <link href="/admin/config.yml" rel="cms-config-url" />
</head>
<body>
  <script>
    // 页面一加载，立刻检查 hash 里的 token
    (function () {
      const hash = location.hash;
      let token = null;

      // 匹配两种格式：#access_token= 或 #/access_token=
      if (hash.startsWith('#access_token=')) {
        token = hash.replace('#access_token=', '');
      } else if (hash.startsWith('#/access_token=')) {
        token = hash.replace('#/access_token=', '');
      }

      if (token && token.startsWith('gho_')) {
        // 构造 Decap 能识别的格式
        const authData = {
          token: token,
          expires_at: Date.now() + 8 * 3600 * 1000
        };
        // 写入 localStorage
        localStorage.setItem('decap-cms-auth', JSON.stringify(authData));
        localStorage.setItem('netlify-cms-auth', JSON.stringify(authData));
        // 强制刷新一次页面，让 Decap 正常加载
        location.href = location.pathname;
      }
    })();
  </script>

  <!-- 再加载 Decap CMS -->
  <script src="./decap-cms.js"></script>
</body>
</html>
