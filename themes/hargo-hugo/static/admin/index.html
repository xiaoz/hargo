 <!-- 使用稳定的 jsdelivr CDN -->
 <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.3.0/dist/decap-cms.min.js"></script>

 <script>

console.log(1);


  // 只在页面加载时执行一次
  (function() {
      // 1. 从 URL hash 拿到 access_token
      const hash = window.location.hash;


      console.log(hash);


      if (!hash.startsWith('#access_token=')) return;

      const token = hash.replace('#access_token=', '');
      if (!token || !token.startsWith('gho_')) return;

      // 2. 构造 Decap 3.x 必须的格式
      const auth = {
        token: token,
        expires_at: Date.now() + 8 * 3600 * 1000 // 8小时后过期
      };

      console.log(auth);
      // 3. 写入 localStorage（必须是这个 key）
      localStorage.setItem('decap-cms-auth', JSON.stringify(auth));
      // 兼容旧版
      localStorage.setItem('netlify-cms-auth', JSON.stringify(auth));

      console.log(123);
      // 4. 清空 hash，刷新页面，让 Decap 重新初始化
      window.location.href = window.location.pathname;
    })();
 </script>
