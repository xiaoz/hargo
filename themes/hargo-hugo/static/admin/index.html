<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Decap CMS 管理后台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>

<!-- Decap CMS 会自动初始化，不要写 CMS.init()！ -->
<script src="https://unpkg.com/decap-cms@^3.2.0/dist/decap-cms.js"></script>

<!-- 登录逻辑：读 token、存 localStorage、清 URL -->
<script>
(function () {
  let token = null;

  // 1. #access_token=xxx
  if (location.hash.startsWith('#access_token=')) {
    token = location.hash.slice('#access_token='.length);
  }

  // 2. ?access_token=xxx
  const params = new URLSearchParams(location.search);
  if (!token) token = params.get('access_token');

  // 存到 localStorage，清 URL
  if (token) {
    localStorage.setItem('access_token', token);
    history.replaceState({}, document.title, location.pathname);
  }
})();
</script>

</body>
</html>
