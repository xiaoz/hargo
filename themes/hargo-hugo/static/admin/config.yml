site_url: https://hargo.pages.dev
display_url: https://hargo.pages.dev

backend:
  name: github
  repo: xiaoz/hargo   # 你的 GitHub 仓库
  branch: main
  base_url: https://sveltia-cms-auth.24409917.workers.dev  # 你的 Worker 地址

media_folder: static/images
public_folder: /images

publish_mode: editorial_workflow

collections:
  - name: products
    label: 商品管理
    folder: content/products
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "商品名称", name: "title", widget: "string" }
      - { label: "商品ID(SKU)", name: "product_id", widget: "string" }
      - { label: "基础价格", name: "price", widget: "number", value_type: "float" }
      - label: "商品图片"
        name: "images"
        widget: "list" 
        fields: 
          - { name: image, widget: image } 
      - { label: "商品分类", name: "categories", widget: list , field: { name: cat, widget: string }}
      - { label: "商品标签",name: tags,  widget: list, field: { name: tag, widget: string } }
      - { label: "商品简介", name: "description", widget: "text" }
      - { label: "上架状态", name: "draft", widget: "boolean", default: false }
      - label: "商品规格"
        name: "variants"
        widget: "list"
        fields:
          - { label: "规格名称", name: "name", widget: "string" }
          - { label: "规格价格", name: "price", widget: "number", value_type: "float" }
          - { label: "库存", name: "stock", widget: "number", default: 100 }
      - { label: "商品详情", name: "body", widget: "markdown" }
      # ===================== 博客文章 =====================
  - name: blog
    label: Blog
    folder: content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }